<!-- ================= MODAL DE CONTÊINERES ================= -->
<div class="modal-overlay" id="modalContainersOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>
        <i class="fas fa-cubes-stacked"></i>
        <span>Gerenciar Contêineres</span>
      </h2>
      <button class="btn-close" id="closeContainersBtn" title="Fechar">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <form id="containerForm" class="form-grid form-grid-compact" autocomplete="off">
      <div class="input-group">
        <label for="containerCodigo">Código *</label>
        <input type="text" id="containerCodigo" placeholder="Ex: 365" required />
      </div>
      <div class="input-group span-2">
        <label for="containerNome">Nome do Contêiner *</label>
        <input type="text" id="containerNome" placeholder="Ex: Contêiner EPI" required />
      </div>
      <div class="input-group">
        <label for="containerLocal">Local / Observação</label>
        <input type="text" id="containerLocal" placeholder="Ex: Pátio Norte" />
      </div>
      <div class="form-actions span-2">
        <button type="button" class="btn btn-secondary" id="cancelContainerEditBtn" style="display:none;">
          <i class="fas fa-times"></i> Cancelar Edição
        </button>
        <button type="submit" class="btn btn-primary" id="containerSubmitBtn">
          <i class="fas fa-plus"></i> Cadastrar Contêiner
        </button>
      </div>
    </form>

    <div class="modal-divider">
      <span><i class="fas fa-list"></i> Contêineres cadastrados (<span id="containerListCount">0</span>)</span>
    </div>

    <div class="modal-list-wrapper" style="max-height: 320px;">
      <table class="modal-table">
        <thead>
          <tr>
            <th>Código</th><th>Nome</th><th>Local</th><th>Itens</th><th class="col-actions">Ações</th>
          </tr>
        </thead>
        <tbody id="containerListBody"></tbody>
      </table>
      <div class="empty-message" id="containerEmpty" style="display:none;">
        Nenhum contêiner cadastrado ainda.
      </div>
    </div>
  </div>
</div>
