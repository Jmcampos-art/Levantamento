<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WALP Enterprise 4.0</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="enterprise.css"></head><body><div id="app"><section class="auth" id="login"><div class="login-card"><div class="logo">W<span>A</span>LP <small>ENTERPRISE 4.0</small></div><h1>Controle de EPIs</h1><p>Acesse seu contêiner com segurança.</p><form id="operatorLogin"><label>Código secreto do contêiner<input name="code" type="password" autocomplete="off" required minlength="16"></label><label>Matrícula<input name="matricula" required autocomplete="username"></label><label>PIN individual<input name="pin" type="password" required autocomplete="current-password"></label><button> Acessar contêiner</button></form><button class="link" id="showAdmin">Acesso administrativo</button><form id="adminLogin" hidden><label>E-mail administrativo<input name="email" type="email" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar como administrador</button></form><p class="notice" id="loginMsg" role="status"></p></div></section><section id="workspace" hidden><aside><div class="logo">W<span>A</span>LP <small>4.0</small></div><nav id="nav"></nav><button id="logout" class="secondary">Encerrar sessão</button></aside><main><header><div><small id="context">Sistema de gestão</small><h1 id="heading">Dashboard</h1></div><span id="who"></span></header><div id="notice" role="status"></div><div id="content"></div></main></section></div><script src="config.js"></script><script type="module" src="enterprise.js"></script></body></html>
