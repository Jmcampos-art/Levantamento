<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WALP Enterprise 4.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="enterprise.css"><link rel="stylesheet" href="admin-simple.css">
</head>
<body>
<div id="app">
<section class="auth" id="login">
  <div class="login-card">
    <div class="logo">W<span>A</span>LP <small>ENTERPRISE 4.0</small></div>
    <h1>Controle de EPIs</h1>
    <p>Consulte e registre entradas e saídas de EPIs no seu contêiner.</p>
    <form id="operatorLogin">
      <label>Código do contêiner
        <input name="code" type="password" inputmode="numeric" pattern="[0-9]{3}" minlength="3" maxlength="3" autocomplete="off" placeholder="3 dígitos" required>
      </label>
      <button type="submit">Abrir contêiner</button>
    </form>
    <button class="link" id="showAdmin" type="button">Acesso administrativo</button>
    <form id="adminLogin" hidden>
      <label>E-mail administrativo<input name="email" type="email" autocomplete="username" required></label>
      <label>Senha<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Entrar como administrador</button>
    </form>
    <p class="notice" id="loginMsg" role="status"></p>
  </div>
</section>
<section id="workspace" hidden>
  <aside><div class="logo">W<span>A</span>LP <small>4.0</small></div><nav id="nav"></nav><button id="logout" class="secondary">Encerrar sessão</button></aside>
  <main><header><div><small id="context">Sistema de gestão</small><h1 id="heading">Dashboard</h1></div><span id="who"></span></header><div id="notice" role="status"></div><div id="content"></div></main>
</section>
</div>
<script src="config.js"></script>
<script type="module" src="enterprise.js"></script>
</body>
</html>
